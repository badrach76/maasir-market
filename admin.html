<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | سوق معاصر المغرب</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="main-header">
        <div class="container header-container">
            <div class="logo-area">
                <h1 class="logo-title">سوق معاصر المغرب</h1>
                <span class="logo-subtitle">لوحة التحكم الإدارية</span>
            </div>
            <nav class="main-nav">
                <ul class="nav-links">
                    <li><a href="index.html"><i class="fas fa-home"></i> الرئيسية</a></li>
                    <li><a href="professional.html"><i class="fas fa-newspaper"></i> المستجدات المهنية</a></li>
                    <li><a href="admin.html" class="active"><i class="fas fa-user-shield"></i> لوحة الإدارة</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container page-container">
        <div class="admin-dashboard">
            <h2><i class="fas fa-cogs"></i> إدارة المقالات والمستجدات المهنية</h2>
            <p>إضافة، تعديل، أو حذف الأخبار والإعلانات الموجهة للمهنيين.</p>

            <div class="admin-form-card">
                <h3>إضافة خبر أو مستجد جديد</h3>
                <form id="addNewsForm">
                    <div class="form-group">
                        <label for="newsTitle">عنوان الخبر:</label>
                        <input type="text" id="newsTitle" required placeholder="أدخل عنوان الخبر هنا...">
                    </div>
                    <div class="form-group">
                        <label for="newsCategory">التصنيف:</label>
                        <select id="newsCategory">
                            <option value="news">أخبار القطاع</option>
                            <option value="laws">قوانين وتشريعات</option>
                            <option value="onssa">توجيهات ONSSA</option>
                            <option value="prices">الأسواق والأسعار</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="newsContent">محتوى الخبر:</label>
                        <textarea id="newsContent" rows="5" required placeholder="اكتب تفاصيل الخبر والمستجد المهني..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> نشر الخبر</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container footer-content">
            <p>&copy; 2026 سوق معاصر المغرب (Maassir Market). جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
